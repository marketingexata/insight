<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PlanSight</title>
    <!-- ===== LIBRARY (chart, OCR, excel, pdf, gambar) ===== -->
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      button,
      input,
      select {
        font-family: inherit;
      }

      /* ============================================================
   VARIABEL WARNA (ganti warna tema di sini)
   ============================================================ */
      :root {
        --a: #141414;
        --b: #8a8a8a;
        --c: #4a4a4a;
        --y: #b8b8b8;
        --ink: #1d1b3a;
        --mut: #7b7a99;
        --bg: #f5f6fc;
        --g: linear-gradient(135deg, #141414, #8a8a8a);
      }
      body {
        font:
          14px/1.5 "IBM Plex Sans",
          system-ui,
          sans-serif;
        background: var(--bg);
        color: var(--ink);
        display: flex;
        min-height: 100vh;
      }

      /* ============================================================
   LAYOUT: SIDEBAR & AREA UTAMA
   ============================================================ */
      aside {
        width: 210px;
        padding: 20px 14px;
        position: sticky;
        top: 0;
        height: 100vh;
        background: #fff;
        border-right: 1px solid #ececf6;
      }
      .logo {
        font-weight: 800;
        font-size: 18px;
        background: var(--g);
        -webkit-background-clip: text;
        color: transparent;
        margin: 0 8px 22px;
      }
      nav button {
        display: block;
        width: 100%;
        text-align: left;
        padding: 11px 12px;
        border: 0;
        background: 0;
        border-radius: 12px;
        font-weight: 600;
        font-size: 14px;
        color: var(--mut);
        cursor: pointer;
        transition: 0.25s;
        margin-bottom: 4px;
      }
      nav button:hover {
        background: #f1efff;
        color: var(--a);
        transform: translateX(3px);
      }
      nav button.on {
        background: var(--g);
        color: #fff;
        box-shadow: 0 6px 16px #14141455;
      }
      main {
        flex: 1;
        padding: 24px 28px;
        min-width: 0;
      }

      /* ============================================================
   ANIMASI HALAMAN
   ============================================================ */
      .in > * {
        animation: up 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      .in > *:nth-child(2) {
        animation-delay: 0.07s;
      }
      .in > *:nth-child(3) {
        animation-delay: 0.14s;
      }
      .in > *:nth-child(4) {
        animation-delay: 0.21s;
      }
      @keyframes up {
        from {
          opacity: 0;
          transform: translateY(18px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      /* ============================================================
   FILTER, CHIP & INPUT
   ============================================================ */
      .bar {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 18px;
      }
      .chip {
        padding: 7px 14px;
        border-radius: 99px;
        border: 1.5px solid #e4e2f5;
        background: #fff;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        transition: 0.2s;
      }
      .chip:hover {
        border-color: var(--a);
        transform: translateY(-2px);
      }
      .chip.on {
        background: var(--ink);
        color: #fff;
        border-color: var(--ink);
      }
      input,
      select {
        padding: 9px 11px;
        border: 1.5px solid #e4e2f5;
        border-radius: 12px;
        background: #fff;
        font-size: 13px;
        width: 100%;
        outline: 0;
        transition: 0.2s;
      }
      input:focus,
      select:focus {
        border-color: var(--a);
        box-shadow: 0 0 0 3px #14141422;
      }
      .bar input,
      .bar select {
        width: auto;
      }

      /* ============================================================
   KARTU & JUDUL
   ============================================================ */
      .card {
        background: #fff;
        border-radius: 20px;
        padding: 20px;
        box-shadow: 0 4px 20px #1d1b3a0d;
        margin-bottom: 16px;
        transition: 0.25s;
      }
      .card:hover {
        box-shadow: 0 10px 30px #14141422;
      }
      h1 {
        font-size: 24px;
        font-weight: 800;
        margin-bottom: 14px;
      }
      h3 {
        font-size: 15px;
        margin-bottom: 12px;
      }

      /* ============================================================
   KARTU KPI & GRID
   ============================================================ */
      .kpis {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 16px;
      }
      .kpi {
        position: relative;
        overflow: hidden;
        color: #fff;
        margin: 0 0 16px;
      }
      .kpi:nth-child(1) {
        background: linear-gradient(135deg, #141414, #2e2e2e);
      }
      .kpi:nth-child(2) {
        background: linear-gradient(135deg, #4a4a4a, #6e6e6e);
      }
      .kpi:nth-child(3) {
        background: linear-gradient(135deg, #8a8a8a, #cfcfcf);
      }
      .kpi:nth-child(4) {
        background: linear-gradient(135deg, #a0a0a0, #b8b8b8);
      }
      .kpi span {
        position: absolute;
        right: 14px;
        top: 10px;
        font-size: 28px;
        opacity: 0.9;
      }
      .kpi h2 {
        font-size: 30px;
        font-weight: 800;
      }
      .kpi:hover {
        transform: translateY(-4px);
      }
      .g2 {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 16px;
      }

      /* ============================================================
   TABEL
   ============================================================ */
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      th {
        text-align: left;
        color: var(--mut);
        font-size: 11px;
        text-transform: uppercase;
        padding: 8px;
        white-space: nowrap;
      }
      td {
        padding: 9px 8px;
        border-top: 1px solid #f0effa;
      }
      tr.r {
        cursor: pointer;
        transition: 0.15s;
      }
      tr.r:hover {
        background: #f6f4ff;
      }
      .sc {
        overflow-x: auto;
      }
      .bd {
        padding: 2px 9px;
        border-radius: 99px;
        font-weight: 700;
        font-size: 12px;
      }
      .up {
        background: #d9fbf6;
        color: #00997f;
      }
      .dn {
        background: #ffe3ec;
        color: #d9d9d9;
      }
      .top {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 9px 0;
        border-top: 1px solid #f0effa;
        font-size: 13px;
      }
      .top b {
        color: var(--a);
      }

      /* ============================================================
   FORM INPUT, TOMBOL & OCR
   ============================================================ */
      .form {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 12px;
      }
      label {
        font-size: 12px;
        font-weight: 600;
        color: var(--mut);
      }
      .btn {
        border: 0;
        padding: 11px 22px;
        border-radius: 12px;
        background: var(--g);
        color: #fff;
        font-weight: 700;
        cursor: pointer;
        transition: 0.2s;
        box-shadow: 0 6px 16px #8a8a8a44;
      }
      .btn:hover {
        transform: translateY(-2px) scale(1.03);
      }
      .btn.o {
        background: #fff;
        color: var(--ink);
        border: 1.5px solid #e4e2f5;
        box-shadow: none;
      }
      .drop {
        border: 2px dashed #cfc9f7;
        border-radius: 16px;
        padding: 18px;
        text-align: center;
        background: #faf9ff;
        margin-bottom: 14px;
      }

      /* ============================================================
   PLANNER (MINGGUAN / BULANAN)
   ============================================================ */
      .wk {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 10px;
      }
      .day {
        background: #fff;
        border-radius: 16px;
        padding: 10px;
        min-height: 150px;
        box-shadow: 0 4px 14px #1d1b3a0a;
      }
      .day h4 {
        font-size: 12px;
        color: var(--mut);
        margin-bottom: 8px;
      }
      .day.today {
        outline: 2px solid var(--b);
      }
      .day.x {
        opacity: 0.45;
      }
      .pc {
        border-left: 4px solid var(--a);
        background: #f7f6ff;
        border-radius: 8px;
        padding: 6px 8px;
        margin-bottom: 6px;
        font-size: 12px;
        cursor: pointer;
        transition: 0.2s;
      }
      .pc:hover {
        transform: scale(1.03);
      }
      .pc small {
        display: block;
        color: var(--mut);
      }
      .s-Ide {
        border-color: var(--y);
      }
      .s-Siap {
        border-color: var(--c);
      }
      .s-Tayang {
        border-color: var(--b);
      }
      .mn .day {
        min-height: 96px;
      }
      .mn .pc {
        padding: 3px 6px;
        margin-bottom: 3px;
      }

      /* ============================================================
   NOTIFIKASI (TOAST)
   ============================================================ */
      #t {
        position: fixed;
        bottom: 22px;
        right: 22px;
        background: var(--ink);
        color: #fff;
        padding: 12px 18px;
        border-radius: 14px;
        transform: translateY(90px);
        transition: 0.4s;
        z-index: 9;
      }
      #t.s {
        transform: none;
      }

      /* ============================================================
   FORM TERSTRUKTUR, MODAL EXPORT & TEMPLATE GAMBAR
   ============================================================ */
      .pfsw {
        display: flex;
        gap: 12px;
        margin-bottom: 16px;
      }
      .pf {
        flex: 1;
        padding: 14px;
        border-radius: 16px;
        border: 2px solid #e4e2f5;
        background: #fff;
        font-weight: 800;
        font-size: 15px;
        cursor: pointer;
        transition: 0.25s;
      }
      .pf:hover {
        transform: translateY(-3px);
      }
      .pf.ig.on {
        background: linear-gradient(135deg, #8a8a8a, #a0a0a0);
        color: #fff;
        border-color: transparent;
        box-shadow: 0 8px 20px #8a8a8a55;
      }
      .pf.tt.on {
        background: linear-gradient(135deg, #1d1b3a, #00b3a6);
        color: #fff;
        border-color: transparent;
        box-shadow: 0 8px 20px #4a4a4a44;
      }
      .seg {
        background: #fff;
        border-radius: 20px;
        padding: 18px 20px 20px;
        margin-bottom: 16px;
        border: 1.5px solid #ecebf7;
        border-top: 5px solid var(--a);
        box-shadow: 0 4px 18px #1d1b3a0a;
        transition: 0.25s;
      }
      .seg:hover {
        box-shadow: 0 10px 28px #14141422;
      }
      .seg.ig {
        border-top-color: var(--b);
      }
      .seg.tt {
        border-top-color: var(--c);
      }
      .seg h4 {
        font-size: 14px;
        margin-bottom: 14px;
      }
      .act {
        position: sticky;
        bottom: 10px;
        z-index: 5;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }
      .mo {
        position: fixed;
        inset: 0;
        background: #1d1b3a88;
        backdrop-filter: blur(4px);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 20;
      }
      .mo.on {
        display: flex;
      }
      .mb {
        background: #fff;
        border-radius: 24px;
        padding: 26px;
        width: min(580px, 94vw);
        max-height: 92vh;
        overflow: auto;
        animation: up 0.4s both;
      }
      .mb h2 {
        margin-bottom: 6px;
      }
      .mb h4 {
        margin: 14px 0 8px;
        font-size: 13px;
        color: var(--mut);
      }
      .pv {
        margin: 16px 0;
        padding: 10px 14px;
        background: #f1efff;
        border-radius: 12px;
        font-weight: 600;
      }
      #xp {
        position: fixed;
        left: -99999px;
        top: 0;
        width: 1500px;
        padding: 32px;
        background: #f5f6fc;
        font-family: "IBM Plex Sans", system-ui, sans-serif;
        color: #1d1b3a;
      }
      .xh {
        border-radius: 22px;
        padding: 26px 30px;
        color: #fff;
        background: linear-gradient(120deg, #141414, #8a8a8a);
        margin-bottom: 22px;
      }
      .xh h1 {
        font-size: 30px;
        margin: 0;
      }
      .xh p {
        opacity: 0.9;
        margin-top: 4px;
      }
      .xs {
        background: #fff;
        border-radius: 20px;
        padding: 18px;
        margin-bottom: 22px;
        box-shadow: 0 6px 24px #1d1b3a14;
      }
      .xs h3 {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 18px;
        margin-bottom: 12px;
      }
      .xb {
        padding: 4px 14px;
        border-radius: 99px;
        color: #fff;
        font-size: 13px;
      }
      .xi {
        background: linear-gradient(135deg, #8a8a8a, #a0a0a0);
      }
      .xk {
        background: linear-gradient(135deg, #1d1b3a, #00b3a6);
      }
      .xt {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        font-size: 12px;
      }
      .xt th {
        color: #fff;
        padding: 10px 8px;
        text-align: center;
        font-weight: 700;
      }
      .xt.i th {
        background: linear-gradient(135deg, #8a8a8a, #a0a0a0);
      }
      .xt.t th {
        background: linear-gradient(135deg, #1d1b3a, #00b3a6);
      }
      .xt th:first-child {
        border-radius: 12px 0 0 12px;
      }
      .xt th:last-child {
        border-radius: 0 12px 12px 0;
      }
      .xt td {
        padding: 8px;
        border-bottom: 1px solid #eeedf8;
        max-width: 260px;
      }
      .xt tr:nth-child(even) td {
        background: #f8f7ff;
      }
      .xt .n {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .xt tr.tot td {
        font-weight: 800;
        background: #efeaff;
        border-bottom: 0;
      }
      .xf {
        text-align: center;
        color: #7b7a99;
        font-size: 12px;
      }

      /* ============================================================
   RESPONSIF (HP / TABLET)
   ============================================================ */
      @media (max-width: 860px) {
        body {
          flex-direction: column;
        }
        aside {
          width: 100%;
          height: auto;
          position: static;
          display: flex;
          overflow-x: auto;
          padding: 10px;
        }
        .logo {
          display: none;
        }
        nav {
          display: flex;
          gap: 6px;
        }
        nav button {
          white-space: nowrap;
        }
        .g2 {
          grid-template-columns: 1fr;
        }
        .wk {
          grid-template-columns: repeat(2, 1fr);
        }
        main {
          padding: 16px;
        }
      }

      /* ===== TEMA MONOKROM (hitam - putih - abu) ===== */
      :root{--a:#141414;--b:#141414;--c:#555;--y:#999;--ink:#141414;--mut:#6b6b6b;--bg:#f4f4f4;--g:#141414}
      body{font-family:"IBM Plex Sans",system-ui,sans-serif}
      aside{width:220px;border-right:1px solid #e3e3e3}
      .logo{background:none;-webkit-background-clip:initial;color:#141414;font-weight:700;font-size:17px;letter-spacing:-.01em;margin:0 8px 14px;padding-bottom:16px;border-bottom:1px solid #e3e3e3}
      nav button{font-weight:500;border-radius:0 6px 6px 0;border-left:2px solid transparent}
      nav button:hover{background:#f0f0f0;color:#141414;transform:none}
      nav button.on{background:#f0f0f0;color:#141414;box-shadow:none;border-left-color:#141414;font-weight:600}
      .in>*{animation:none}
      h1{font-size:22px;font-weight:700;letter-spacing:-.02em}
      .card{border-radius:10px;box-shadow:none;border:1px solid #e3e3e3}.card:hover{box-shadow:none}
      .chip{border-radius:6px;border:1px solid #d4d4d4;font-weight:500}.chip:hover{border-color:#141414;transform:none}.chip.on{background:#141414;color:#fff;border-color:#141414}
      input,select{border-radius:6px;border:1px solid #d4d4d4}input:focus,select:focus{border-color:#141414;box-shadow:0 0 0 3px #14141418}
      .kpi,.kpi:nth-child(n){background:#fff!important;color:#141414}.kpi span{display:none}.kpi small{color:#6b6b6b}.kpi h2{font-weight:600}.kpi:hover{transform:none}
      th{color:#6b6b6b;font-weight:600;text-transform:none;font-size:12px}
      td{border-top:1px solid #ececec}tr.r:hover{background:#f6f6f6}
      .bd{border-radius:4px;font-weight:600}.up{background:#141414;color:#fff}.dn{background:#fff;color:#141414;border:1px solid #141414}
      .btn{border-radius:6px;background:#141414;box-shadow:none;font-weight:600}.btn:hover{transform:none;background:#333}
      .btn.o{background:#fff;color:#141414;border:1px solid #cfcfcf}.btn.o:hover{background:#f4f4f4}
      .drop{border:1px dashed #bdbdbd;border-radius:8px;background:#fafafa}
      .day{border-radius:10px;box-shadow:none;border:1px solid #e3e3e3}.day.today{outline:2px solid #141414}
      .pc{border-radius:4px;background:#f4f4f4;border-left-color:#141414}.pc:hover{transform:none;background:#ebebeb}
      .s-Ide{border-left-color:#cfcfcf}.s-Produksi{border-left-color:#8a8a8a}.s-Siap{border-left-color:#4a4a4a}.s-Tayang{border-left-color:#141414}
      #t{border-radius:6px}label{font-weight:500;display:block;margin-bottom:5px}
      .pfsw{display:inline-flex;gap:0;border:1px solid #cfcfcf;border-radius:8px;padding:3px;background:#fff;margin-bottom:16px}
      .pf{flex:none;min-width:150px;border:0;border-radius:6px;padding:9px 18px;font-size:13px;font-weight:600;background:none;color:#6b6b6b}.pf:hover{transform:none;color:#141414}
      .pf.ig.on,.pf.tt.on{background:#141414;color:#fff;box-shadow:none}
      .seg{padding:0;border:1px solid #dcdcdc;border-top:1px solid #dcdcdc;border-radius:10px;box-shadow:none;overflow:hidden}
      .seg.ig,.seg.tt{border-top-color:#dcdcdc}.seg:hover{box-shadow:none}
      .sh{display:flex;align-items:center;gap:10px;padding:13px 18px;background:#fafafa;border-bottom:1px solid #e3e3e3}
      .seg h4{margin:0;font-size:14px;font-weight:600}.sn{margin-left:auto;font-size:12px;color:#8a8a8a}
      .pt{font-size:11px;font-weight:600;padding:2px 9px;border-radius:4px}.seg.ig .pt{background:#141414;color:#fff}.seg.tt .pt{border:1px solid #141414;color:#141414}
      .seg>.form{padding:18px}.seg>.drop{margin:18px}
      details.seg>summary{cursor:pointer;padding:13px 18px;font-weight:600;background:#fafafa;list-style:none}
      details.seg[open]>summary{border-bottom:1px solid #e3e3e3}details.seg>.inb{padding:18px}
      .mo{background:#14141466;backdrop-filter:none}.mb{border-radius:12px;width:min(660px,94vw);animation:none}
      .mb h2{font-size:18px}.mb h4{font-size:12px;font-weight:600;color:#141414;margin:20px 0 8px}
      .pv{background:#f4f4f4;border:1px solid #e3e3e3;border-radius:6px}
      .opt{padding:7px 14px;border:1px solid #d4d4d4;background:#fff;border-radius:6px;font-weight:500;font-size:13px;cursor:pointer;margin:0 6px 6px 0}.opt:hover{border-color:#141414}.opt.on{background:#141414;color:#fff;border-color:#141414}
      .optl{display:block;width:100%;text-align:left;padding:10px 14px;border:1px solid #d4d4d4;background:#fff;border-radius:8px;margin-bottom:8px;cursor:pointer;font-size:13px}
      .optl b{display:block;font-weight:600}.optl small{color:#6b6b6b}.optl.on{border-color:#141414;box-shadow:inset 0 0 0 1px #141414;background:#fafafa}
      /* ===== TEMPLATE GAMBAR TABEL ===== */
      #xp{background:#fff;color:#141414;padding:40px;font-family:"IBM Plex Sans",system-ui,sans-serif}
      #xp.p{width:1080px;font-size:12px}#xp.l{width:1560px}

      function toNum(s, u) {
        if (u) return parseFloat(s.replace(",", ".")) * (u[0] == "j" ? 1e6 : 1e3);
        return parseFloat(s.replace(/[.,](?=\d{3}\b)/g, "").replace(",", "."));
      }
      function firstNum(s) {
        const m = [...s.matchAll(/(\d[\d.,]*)\s*(ribu|rb|jt|juta|k\b)?(\s*%)?/g)].find((x) => !x[3]);
        return m ? toNum(m[1], m[2]) : null;
      }
      async function ocr(f) {
        if (!f) return;
        const o = $("#ocs");
        o.textContent = "Membaca gambar… 0%";
        try {
          const { data } = await Tesseract.recognize(f, "ind+eng", {
            logger: (m) =>
              m.status == "recognizing text" &&
              (o.textContent = "Membaca gambar… " + Math.round(m.progress * 100) + "%"),
          });
          const L = data.text.toLowerCase().split("\n");
          let hit = 0;
          for (const [key, kws] of Object.entries(OCR[S.tab])) {
            for (const kw of kws) {
              const i = L.findIndex((l) => l.includes(kw));
              if (i < 0) continue;
              const v = [L[i].slice(L[i].indexOf(kw) + kw.length), L[i + 1] || "", L[i - 1] || ""]
                .map((s) => firstNum(s))
                .find((x) => x != null);
              if (v != null && $("#f_" + key)) {
                $("#f_" + key).value = Math.round(v * 100) / 100;
                hit++;
                break;
              }
            }
          }
          o.innerHTML = `${hit} angka terbaca. <b>Cek ulang tiap kolom</b> sebelum simpan.<details><summary>Lihat teks mentah</summary><pre style="white-space:pre-wrap;text-align:left">${esc(data.text)}</pre></details>`;
        } catch (e) {
          o.textContent = "OCR gagal: " + e;
        }
      }

      /* ============================================================
   SECTION: IMPOR EXCEL
   ============================================================ */
      const IM = {
        "Tayangan total": "tayangan",
        Pemirsa: "pemirsa",
        "Waktu tonton rata-rata": "waktu_tonton",
        Mengikuti: "mengikuti",
        Like: "like",
        Komen: "komen",
        Repost: "repost",
        Share: "share",
        Simpan: "simpan",
        "Jangkauan Total": "jangkauan",
        "Kunjungan profil": "kunjungan_profil",
        "Ketukan tautan eksternal": "klik_tautan",
        Budget: "budget",
      };
      const ex = (v) => new Date(Math.round((v - 25569) * 864e5) + 432e5).toISOString().slice(0, 10);
      const ACC = [
        ["EXATA AI", "Instagram", "EXATA_AI_IG"],
        ["EXATA MT", "TikTok", "EXATA_MT_TT"],
        ["EXATA SN", "TikTok", "EXATA_SN_TT"],
        ["JP Smart", "Instagram", "JPSmart_IG"],
        ["JP Smart", "TikTok", "JPSmart_TT"],
        ["JLCT", "Instagram", "JLCT_IG"],
        ["JLCT", "TikTok", "JLCT_TT"],
        ["J-Expert", "Instagram", "JExpert_IG"],
        ["J-Expert", "TikTok", "JExpert_TT"],
      ];
      let SKIP = 0;
      const dt = (v) => {
        if (typeof v == "number") return ex(v);
        const s = String(v).trim(),
          m = s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);
        if (m) return m[3] + "-" + m[2].padStart(2, "0") + "-" + m[1].padStart(2, "0");
        return /^\d{4}-\d{2}-\d{2}/.test(s) ? s.slice(0, 10) : "";
      };
      const nv = (v) => {
        if (typeof v == "number") return v;
        let s = String(v).trim().replace(/%/g, "");
        if (!s || s == "-") return "";
        s = /^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)
          ? s.replace(/\./g, "").replace(",", ".")
          : s.replace(",", ".");
        const x = parseFloat(s);
        return isNaN(x) ? "" : x;
      };
      const pick = (v, L) =>
        L.find((x) => x.toLowerCase() == String(v).trim().toLowerCase()) || String(v).trim();
      const slug = (s) =>
        String(s || "")
          .toLowerCase()
          .replace(/\W+/g, "")
          .slice(0, 16);
      const uid = (b, seen) => {
        seen[b] = (seen[b] || 0) + 1;
        return seen[b] > 1 ? b + "_" + seen[b] : b;
      };
      function flat(ws, kind, def, out, seen) {
        const X = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: "" }),
          map = {},
          typ = {};
        F[kind].forEach(([k, l, t]) => {
          map[k] = k;
          map[l.toLowerCase()] = k;
          typ[k] = t;
        });
        const key = (c) => map[String(c).trim().toLowerCase()];
        const hi = X.findIndex((r) => r.some((c) => key(c) == "tanggal" || key(c) == "mulai"));
        if (hi < 0) return;
        const col = X[hi].map(key);
        X.slice(hi + 1).forEach((r) => {
          const o = { ...def };
          col.forEach((k, i) => {
            if (!k || r[i] === "" || r[i] == null) return;
            const t = typ[k];
            o[k] =
              t == "date"
                ? dt(r[i])
                : t == "num"
                  ? nv(r[i])
                  : Array.isArray(t)
                    ? pick(r[i], t)
                    : String(r[i]).trim();
          });
          if (!(o.tanggal || o.mulai)) {
            if (r.some((c) => c !== "")) SKIP++;
            return;
          }
          if (!BR.includes(o.brand) || !PL.includes(o.platform)) {
            SKIP++;
            return;
          }
          if (kind == "konten") {
            if (o.tayangan === undefined && !o.judul) {
              SKIP++;
              return;
            }
            o.id = uid("i_" + (o.brand + o.platform + o.tanggal).replace(/\W/g, ""), seen);
          }
          if (kind == "akun") {
            o.selesai = o.selesai || o.mulai;
            o.id = uid("a_" + (o.brand + o.platform + o.tipe + o.mulai).replace(/\W/g, ""), seen);
          }
          if (kind == "planner") {
            if (!o.judul) {
              SKIP++;
              return;
            }
            o.id = uid("p_" + (o.brand + o.platform + o.tanggal + slug(o.judul)).replace(/\W/g, ""), seen);
          }
          F[kind].forEach(([k]) => {
            if (o[k] === undefined) o[k] = "";
          });
          out.push(o);
        });
      }
      function legacy(wb, nm, out) {
        const u = nm.toUpperCase(),
          brand = u.includes("EXATA")
            ? "EXATA " + u.split("-").pop().trim()
            : u.includes("JP")
              ? "JP Smart"
              : u.includes("JLCT")
                ? "JLCT"
                : u.includes("EXPERT")
                  ? "J-Expert"
                  : null;
        if (!brand) return;
        const X = XLSX.utils.sheet_to_json(wb.Sheets[nm], { header: 1, raw: true, defval: "" }),
          row = (l) => X.find((r) => String(r[0]).trim() == l) || [],
          T = row("Tanggal"),
          KN = row("Konten"),
          FR = row("Format"),
          LK = row("Link konten"),
          P = [];
        let pf = "";
        (X[0] || []).forEach((v, c) => {
          const s = String(v).toUpperCase();
          if (s.includes("INSTAGRAM")) pf = "Instagram";
          else if (s.includes("TIKTOK")) pf = "TikTok";
          P[c] = pf;
        });
        for (let c = 1; c < T.length; c++) {
          if (typeof T[c] != "number" || !P[c]) continue;
          const r = {
            id: "i_" + (brand + P[c] + ex(T[c])).replace(/\W/g, ""),
            tanggal: ex(T[c]),
            brand,
            platform: P[c],
            format: FR[c] || "",
            judul: KN[c] || "",
            link: LK[c] || "",
            ads: "Tidak",
          };
          let has = 0;
          for (const [l, k] of Object.entries(IM)) {
            let v = row(l)[c];
            if (v === "" || v === "-" || v === undefined) {
              r[k] = "";
              continue;
            }
            if (k != "waktu_tonton") {
              v = nv(v);
              if (v === "") {
                r[k] = "";
                continue;
              }
            }
            r[k] = v;
            if (k == "tayangan") has = 1;
          }
          if (has) out.push(r);
        }
      }
      async function imp(f) {
        if (!f) return;
        const o = $("#ims");
        o.textContent = "Membaca Excel…";
        try {
          const wb = XLSX.read(await f.arrayBuffer()),
            out = { planner: [], konten: [], akun: [] },
            seen = {};
          SKIP = 0;
          wb.SheetNames.forEach((nm) => {
            const ws = wb.Sheets[nm];
            if (/^konten_/i.test(nm)) {
              const a = ACC.find((x) => x[2].toLowerCase() == nm.slice(7).toLowerCase());
              a && flat(ws, "konten", { brand: a[0], platform: a[1], ads: "Tidak" }, out.konten, seen);
            } else if (/^insight_akun/i.test(nm)) flat(ws, "akun", { tipe: "bulanan" }, out.akun, seen);
            else if (/^planner/i.test(nm)) flat(ws, "planner", { status: "Ide" }, out.planner, seen);
            else legacy(wb, nm, out.konten);
          });
          const tot = out.planner.length + out.konten.length + out.akun.length;
          if (!tot) {
            o.textContent =
              "Tidak ada data terbaca. Cek nama sheet & header kolom (lihat sheet PETUNJUK di template).";
            return;
          }
          if (
            !confirm(
              "Impor " +
                out.konten.length +
                " konten, " +
                out.akun.length +
                " insight akun, " +
                out.planner.length +
                " planner?" +
                (SKIP ? "\n(" + SKIP + " baris dilewati: tanggal/brand/platform tidak valid)" : ""),
            )
          ) {
            o.textContent = "Dibatalkan.";
            return;
          }
          for (const k of Object.keys(out)) {
            if (!out[k].length) continue;
            out[k].forEach((r) => {
              const i = DB[k].findIndex((x) => x.id == r.id);
              i < 0 ? DB[k].push(r) : (DB[k][i] = r);
            });
            localStorage["db_" + k] = JSON.stringify(DB[k]);
            try {
              await API.post({ action: "batch", sheet: k, rows: out[k] });
            } catch (e) {
              toast("Gagal ke Sheets: " + e);
            }
          }
          toast("Impor selesai (" + tot + " data)");
          render();
        } catch (e) {
          o.textContent = "Gagal baca Excel: " + e;
        }
      }

          .join("")}</div>
${L.map((r) => `<div class="card top" style="align-items:center"><span><b>${r.tipe == "bulanan" ? "" : ""} ${esc(r.periode)}</b> · ${esc(r.brand)}<br><small>Disimpan ${esc(r.dibuat)}</small></span><span><button class="btn o" onclick="S.hv='${r.id}';render()">Lihat</button> <button class="btn o" onclick="del('histori','${r.id}')"></button></span></div>`).join("") || "<p>Belum ada snapshot. Simpan yang pertama! </p>"}
${d ? `<div class="card"><h3>Detail: ${esc(cur.periode)} · ${esc(cur.brand)}</h3>${mt(["brand", "platform", "dilihat", "dilihat_vs", "pengikut_bersih", "interaksi", "kunjungan_profil", "klik_bio"], d.akun)}<h3 style="margin-top:14px">Ringkasan konten</h3>${mt(["brand", "platform", "n", "tayangan", "like", "komen", "share", "simpan"], d.ringkas)}<h3 style="margin-top:14px">Top 5 konten</h3>${mt(["brand", "judul", "tayangan"], d.top)}</div>` : ""}`;
      };

      /* ============================================================
   SECTION: EXPORT
   ============================================================ */
      const EX = { t: "konten", br: [], mode: "single", p: "bulan", f: "xlsx", lay: "portrait" };
      const TT = { akun: "Insight Akun", konten: "Insight Konten", planner: "Planner Konten" };
      const IDK = { konten: ["tanggal", "brand", "format", "judul"], planner: ["tanggal", "brand", "format", "judul"], akun: ["brand", "tipe", "mulai", "selesai"] };
      const lab = (k, key, p) => (LBL[p] || {})[key] || F[k].find((f) => f[0] == key)[1];
      const ck = (k, p) => [...SEG[k]._[1], ...SEG[k][p].flatMap((s) => s[1])].filter((x) => x != "platform");
      const cl = (r, x, t) => {
        const v = r[x];
        if (x == "dilihat_vs") return v === "" || v == null ? "–" : (N(v) > 0 ? "+" : "") + v + "%";
        if (t == "num") return v === "" || v == null ? "–" : fmt(v);
        return String(v ?? "");
      };
      const tot = (T) =>
        T.keys.map((x, i) => (i == 0 ? "Total" : T.ty[i] == "num" && x != "dilihat_vs" ? fmt(T.rows.reduce((s, r) => s + N(r[x]), 0)) : ""));
      const xbl = () => (EX.br.length ? EX.br : BR);
      const xper = () => (EX.p == "bulan" ? S.month : "");
      const xsub = (l) =>
        (!EX.br.length && l.length == BR.length ? "Semua brand" : l.length <= 2 ? l.join(", ") : l.length + " brand") + " · " + (EX.p == "bulan" ? S.month : "Semua bulan");
      const xnm = (b, sfx) =>
        `insight_${EX.t}_${(b || (EX.br.length ? (EX.br.length <= 2 ? EX.br.join("+") : EX.br.length + "-brand") : "semua-brand")).replace(/\W+/g, "-")}_${EX.p == "bulan" ? S.month : "semua-bulan"}${sfx || ""}`;
      const dl = (blob, name) => {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = name;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      };
      // bl = daftar brand, split = pisah per brand, lay = "portrait" (dibagi per segmen) / lainnya (semua kolom)
      function xtabs(bl, split, lay) {
        const out = [],
          pr = xper();
        (EX.t == "semua" ? ["akun", "konten", "planner"] : [EX.t]).forEach((k) => {
          const dk = k == "akun" ? "mulai" : "tanggal",
            all = DB[k]
              .filter((r) => bl.includes(r.brand) && (!pr || String(r[dk]).slice(0, 7) == pr))
              .sort((a, b) => String(a[dk]).localeCompare(String(b[dk])) || a.brand.localeCompare(b.brand));
          (split ? bl : [null]).forEach((b) => {
            const rows = b ? all.filter((r) => r.brand == b) : all;
            PL.forEach((p) => {
              const R = rows.filter((r) => r.platform == p);
              if (!R.length) return;
              const add = (keys, part) =>
                out.push({ k, p, b, keys, rows: R, part, title: TT[k], h: keys.map((x) => lab(k, x, p)), ty: keys.map((x) => F[k].find((f) => f[0] == x)[2]) });
              if (lay != "portrait") return add(ck(k, p));
              SEG[k][p].forEach(([t, ks]) => {
                const c = ks.filter((x) => !IDK[k].includes(x) && x != "link" && x != "platform");
                if (c.length) add([...IDK[k], ...c], t);
              });
            });
          });
        });
        return out;
      }
      function xstats(T) {
        const kind = EX.t == "semua" ? "konten" : EX.t,
          seen = new Set(),
          rows = [];
        T.forEach((t) => {
          if (t.k == kind && !seen.has(t.rows)) {
            seen.add(t.rows);
            rows.push(...t.rows);
          }
        });
        const sm = (f) => rows.reduce((s, r) => s + N(r[f]), 0);
        if (kind == "akun") return [["Periode akun", rows.length], ["Dilihat", sm("dilihat")], ["Pengikut bersih", sm("pengikut_bersih")]];
        if (kind == "planner") return [["Rencana", rows.length], ["Siap tayang", rows.filter((r) => r.status == "Siap").length], ["Sudah tayang", rows.filter((r) => r.status == "Tayang").length]];
        return [["Konten", rows.length], ["Tayangan", sm("tayangan")], ["Interaksi", sm("like") + sm("komen") + sm("share") + sm("simpan")]];
      }
      function xo() {
        EX.br = S.brand == "Semua" ? [] : [S.brand];
        EX.t = { dash: "semua", ins: S.sub == "akun" ? "akun" : "konten", plan: "planner" }[S.view] || EX.t;
        xr();
        $("#xm").classList.add("on");
      }
      const xc = () => $("#xm").classList.remove("on");
      function xb(b) {
        if (b == "Semua") EX.br = [];
        else {
          const i = EX.br.indexOf(b);
          i < 0 ? EX.br.push(b) : EX.br.splice(i, 1);
        }
        xr();
      }
      function xr() {
        const ch = (g, v, l) => `<button class="opt ${EX[g] == v ? "on" : ""}" onclick="EX.${g}='${v}';xr()">${l}</button>`,
          ol = (g, v, t, d) => `<button class="optl ${EX[g] == v ? "on" : ""}" onclick="EX.${g}='${v}';xr()"><b>${t}</b><small>${d}</small></button>`,
          bl = xbl(),
          multi = bl.length > 1,
          nb = xtabs(bl, false, "land").reduce((s, t) => s + t.rows.length, 0),
          ng = EX.mode == "zip" && multi ? bl.filter((b) => xtabs([b], false, "land").length).length : nb ? 1 : 0,
          nf = ng * (EX.f == "png" && EX.lay == "both" ? 2 : 1);
        $("#xm .mb").innerHTML = `<h2>Unduh data</h2><small style="color:var(--mut)">Pilih isi dan bentuk file yang diunduh</small>
<h4>Jenis data</h4><div>${[["akun", "Akun"], ["konten", "Konten"], ["planner", "Planner"], ["semua", "Semua jenis"]].map(([v, l]) => ch("t", v, l)).join("")}</div>
<h4>Brand (boleh lebih dari satu)</h4><div><button class="opt ${EX.br.length ? "" : "on"}" onclick="xb('Semua')">Semua brand</button>${BR.map((b) => `<button class="opt ${EX.br.includes(b) ? "on" : ""}" onclick="xb('${b}')">${b}</button>`).join("")}</div>
${multi ? `<h4>Susunan per brand</h4>${ol("mode", "single", "Satu file gabungan", "Semua brand terpilih dalam tabel yang sama")}${ol("mode", "sheets", "Satu file, dipisah per brand", "Tiap brand punya sheet, halaman, atau bagian sendiri")}${ol("mode", "zip", "File terpisah per brand (ZIP)", "Satu file untuk tiap brand, dikemas dalam ZIP")}` : ""}
<h4>Periode</h4><div>${ch("p", "bulan", "Bulan " + S.month)}${ch("p", "semua", "Semua bulan")}</div>
<h4>Format file</h4><div>${[["xlsx", "Excel"], ["pdf", "PDF"], ["png", "Gambar tabel"]].map(([v, l]) => ch("f", v, l)).join("")}</div>
${EX.f == "png" ? `<h4>Ukuran gambar</h4>${ol("lay", "portrait", "Portrait, 1080 px", "Untuk WhatsApp atau chat. Kolom dibagi per segmen agar tetap terbaca")}${ol("lay", "landscape", "Landscape, 1560 px", "Untuk laporan atau slide. Semua kolom dalam satu tabel")}${ol("lay", "both", "Keduanya", "Dua gambar, dikemas dalam ZIP")}` : ""}
<p class="pv">${nb ? `${nb} baris data · ${nf} file${nf > 1 ? " (dikemas ZIP)" : ""}` : "Belum ada data untuk pilihan ini"}</p>
<button class="btn" onclick="exp()">Unduh</button> <button class="btn o" onclick="xc()">Batal</button>`;
      }
      function xXlsx(T) {
        const wb = XLSX.utils.book_new(),
          used = {};
        T.forEach((t) => {
          const ws = XLSX.utils.aoa_to_sheet([t.h, ...t.rows.map((r) => t.keys.map((x, i) => (t.ty[i] == "num" && r[x] !== "" ? N(r[x]) : (r[x] ?? ""))))]);
          ws["!cols"] = t.h.map((hd, i) => ({ wch: t.keys[i] == "judul" ? 42 : t.keys[i] == "isi_konten" ? 70 : Math.max(12, hd.length + 3) }));
          const base = (t.title.replace("Insight ", "").replace(" Konten", "") + " " + (t.b ? t.b + " " : "") + t.p).replace(/[^\w\- ]/g, "").slice(0, 28);
          let n = base,
            i = 2;
          while (used[n]) n = base + " " + i++;
          used[n] = 1;
          XLSX.utils.book_append_sheet(wb, ws, n);
        });
        return new Blob([XLSX.write(wb, { type: "array", bookType: "xlsx" })], { type: "application/octet-stream" });
      }
      function xPdf(T, sub) {
        const d = new jspdf.jsPDF({ orientation: "l", format: "a3" }),
          W = d.internal.pageSize.getWidth();
        T.forEach((t, i) => {
          i && d.addPage();
          d.setFillColor(22, 62, 115);
          d.rect(10, 8, W - 20, 22, "F");
          d.setFillColor(232, 115, 26);
          d.rect(10, 30, W - 20, 1.2, "F");
          d.setTextColor(255);
          d.setFontSize(18);
          d.text(t.title + (t.b ? " - " + t.b : "") + " - " + t.p, 16, 18);
          d.setFontSize(10);
          d.text(sub + " | " + t.rows.length + " data | " + ds(new Date()), 16, 25);
          d.autoTable({
            head: [t.h],
            body: t.rows.map((r) => t.keys.map((x, j) => cl(r, x, t.ty[j]))),
            foot: t.k == "planner" ? undefined : [tot(t)],
            startY: 36,
            margin: { left: 10, right: 10 },
            theme: "plain",
            styles: { fontSize: 7, cellPadding: 2.2, textColor: [20, 20, 20], lineColor: [225, 225, 225], lineWidth: { bottom: 0.2 } },
            headStyles: { fillColor: [245, 245, 245], textColor: [20, 20, 20], fontStyle: "bold", halign: "center", lineColor: [30, 78, 140], lineWidth: { bottom: 0.6 } },
            footStyles: { fillColor: [234, 241, 251], textColor: [20, 20, 20], fontStyle: "bold" },
            alternateRowStyles: { fillColor: [250, 250, 250] },
            columnStyles: Object.fromEntries(t.keys.map((x, j) => [j, t.ty[j] == "num" ? { halign: "right" } : {}])),
          });
        });
        const n = d.getNumberOfPages();
        for (let i = 1; i <= n; i++) {
          d.setPage(i);
          d.setTextColor(120);
          d.setFontSize(8);
          d.text("InsightHub | hal. " + i + "/" + n, W / 2, d.internal.pageSize.getHeight() - 6, { align: "center" });
        }
        return d.output("blob");
      }
      async function xPng(T, sub, ly) {
        const el = $("#xp"),
          P = ly == "portrait",
          W = P ? 1080 : 1560,
          st = xstats(T),
          td = (t, x, j, v) => `<td class="${t.ty[j] == "num" ? "n" : ""}">${v}</td>`;
        el.className = P ? "p" : "l";
        el.style.width = W + "px";
        el.innerHTML =
          `<div class="xh"><div><small>InsightHub</small><h1>${EX.t == "semua" ? "Laporan Insight & Planner" : TT[EX.t]}</h1><p>${esc(sub)} · dibuat ${ds(new Date())}</p></div><div class="xst">${st.map(([l, v]) => `<div><b>${fmt(v)}</b><span>${l}</span></div>`).join("")}</div></div>` +
          T.map(
            (t) => `<div class="xs"><div class="xsh"><span class="xb ${t.p == "Instagram" ? "xi" : "xk"}">${t.p}</span><h3>${TT[t.k]}${t.b ? " · " + esc(t.b) : ""}${t.part ? `<small>${esc(t.part)}</small>` : ""}</h3><small>${t.rows.length} data</small></div>
<table class="xt"><tr>${t.h.map((x, j) => `<th class="${t.ty[j] == "num" ? "n" : ""}">${esc(x)}</th>`).join("")}</tr>
${t.rows.map((r) => `<tr>${t.keys.map((x, j) => td(t, x, j, esc(cl(r, x, t.ty[j])))).join("")}</tr>`).join("")}
${t.k == "planner" ? "" : `<tr class="tot">${tot(t).map((x, j) => td(t, null, j, x)).join("")}</tr>`}</table></div>`,
          ).join("") +
          '<div class="xf">Dibuat dengan InsightHub</div>';
        const c = await html2canvas(el, {
          backgroundColor: "#ffffff",
          scale: Math.min(2, 16000 / el.offsetHeight),
          windowWidth: W + 80,
          onclone: (d) => (d.getElementById("xp").style.left = "0"),
        });
        el.innerHTML = "";
        return await new Promise((res) => c.toBlob(res, "image/png"));
      }
      async function exp() {
        const bl = xbl(),
          fm = EX.f,
          lays = fm == "png" ? (EX.lay == "both" ? ["portrait", "landscape"] : [EX.lay]) : [null],
          groups = EX.mode == "zip" ? bl.map((b) => [b, [b]]) : [[null, bl]],
          files = [];
        toast("Menyiapkan file…");
        try {
          for (const [b, l] of groups)
            for (const ly of lays) {
              const T = xtabs(l, EX.mode == "sheets", ly || "land");
              if (!T.length) continue;
              const sub = xsub(l),
                blob = fm == "xlsx" ? xXlsx(T) : fm == "pdf" ? xPdf(T, sub) : await xPng(T, sub, ly);
              files.push({ name: xnm(b, ly ? "_" + ly : "") + "." + fm, blob });
            }
          if (!files.length) return toast("Tidak ada data untuk pilihan ini");
          if (files.length == 1) dl(files[0].blob, files[0].name);
          else {
            const z = new JSZip();
            files.forEach((f) => z.file(f.name, f.blob));
            dl(await z.generateAsync({ type: "blob" }), xnm(null, "") + ".zip");
          }
          toast("Export selesai");
          xc();
        } catch (e) {
          toast("Export gagal: " + e);
        }
      }
      load();
    </script>
  </body>
</html>
